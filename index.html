<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Hatim Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Lateef&family=Scheherazade+New&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1d222b;--panel2:#252c36;--gold:#d9b96c;--muted:#a4aab5;--line:#343b47;--white:#f5f5f2;--red:#f0a3a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100dvh;padding:20px 16px 94px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}.brand{font-size:27px;font-weight:750;letter-spacing:-.7px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.moon{border:1px solid var(--line);background:var(--panel);color:var(--gold);width:44px;height:44px;border-radius:15px;font-size:21px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted);font-weight:700}.progressrow{display:flex;align-items:baseline;gap:6px;margin:8px 0}.big{font-size:34px;color:var(--gold);font-weight:750;letter-spacing:-1px}.smallmuted{color:var(--muted);font-size:13px}.track{height:8px;background:#3a414d;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--gold);width:0%;border-radius:20px;transition:width .2s}
.center{text-align:center;padding:14px 0 10px}.zname{color:var(--gold);font-size:22px;font-weight:650;margin:4px}.countrow{display:flex;justify-content:center;align-items:baseline;gap:5px;margin:5px 0}.count{font-size:52px;font-weight:750;letter-spacing:-2px}.birikmis{font-size:24px;color:var(--red);font-weight:700}.counter{width:176px;height:176px;border-radius:50%;margin:10px auto 8px;border:2px solid #a98e50;background:radial-gradient(circle at 35% 30%,#f0d994,#c7a957 70%,#987b3e);color:#1c1b18;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 35px #0005;user-select:none;-webkit-tap-highlight-color:transparent}.counter:active{transform:scale(.97)}.counter .finger{font-size:34px}.counter strong{font-size:15px;letter-spacing:1px;margin-top:4px}.hint{font-size:12px;color:var(--muted)}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}.sectionhead h2{font-size:17px;margin:0}.link{border:0;background:none;color:var(--gold);font-size:13px;padding:5px}
.zrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.zrow:last-child{border:0;padding-bottom:0}.zrow.selectable{cursor:pointer}.zrow.selected{background:#252c36;border-radius:12px;padding-left:10px;padding-right:6px;border-bottom-color:#9b8149}.zinfo{flex:1;min-width:0}.ztitle{font-weight:600}.zmeta{font-size:12px;color:var(--muted);margin-top:4px}.miniadd{width:38px;height:38px;border-radius:13px;border:1px solid #887344;background:#3a3325;color:var(--gold);font-size:23px}.pill{font-size:11px;color:var(--muted);background:var(--panel2);padding:5px 8px;border-radius:20px}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#171b22f2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navinner{width:min(560px,100%);display:flex;justify-content:space-around}.navbtn{border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:65px;padding:5px}.navbtn span:first-child{font-size:20px}.navbtn.active{color:var(--gold)}
.view{display:none}.view.active{display:block}.primary{background:var(--gold);color:#211d13;border:0;border-radius:13px;padding:12px 16px;font-weight:700}.secondary{background:var(--panel2);color:var(--white);border:1px solid var(--line);border-radius:13px;padding:11px 14px}.danger{color:#f0a3a3}.field{display:block;width:100%;background:#12161d;border:1px solid var(--line);color:var(--white);border-radius:12px;padding:12px;margin:7px 0 13px}.label{font-size:12px;color:var(--muted)}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border-radius:14px;padding:14px}.stat b{font-size:25px;color:var(--gold);display:block;margin-top:6px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:var(--panel);border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto;border:1px solid var(--line)}.sheet h3{margin:0 0 15px}.actions{display:flex;gap:9px}.actions>*{flex:1}

/* Arapça Metin Alanı */
#arabicDisplay {
    font-size: 55px; 
    line-height: 1.8; 
    margin: 0; 
    direction: rtl; 
    font-family: 'Scheherazade New', serif;
}

/* Arapça Dev Ekran Modu */
.arapca-dev #activeName { display: none; }
.arapca-dev #detayButonlari { display: none !important; }
.arapca-dev .countrow { margin-top: 20px; }

.table-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
html, body, button { touch-action: manipulation; }
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">Hatim Takip</div><div class="sub" id="todayLabel">Günlük ibadet takibin</div></div><button class="moon" aria-label="Tema">☾</button></header>

<!-- 1. SAYAÇLAR SEKME (Ana Ekran) -->
<section id="home" class="view active">
  <div class="sectionhead" style="margin-top:0;">
    <h2>Sayaçlar</h2>
    <button class="primary" id="addOpen">+ Ekle</button>
  </div>
  <div class="card" id="homeList"></div>
</section>

<!-- DETAY EKRANI -->
<section id="detay" class="view">
  <div style="display:flex; align-items:center; margin-bottom: 10px;">
    <button class="secondary" id="btnGeri" style="padding:8px 12px; margin-right:10px;">← Geri</button>
    <div class="eyebrow" style="margin:0;">DETAY</div>
  </div>

  <div class="card center">
    <!-- TÜM ÜST BUTONLAR YAN YANA -->
    <div style="display: flex; gap: 6px; margin-bottom: 15px; align-items: stretch;">
        <button class="secondary" id="btnToggleOzet" style="flex: 2; padding: 8px 4px; font-weight: bold; color: var(--gold); border-color: var(--gold); font-size: 13px;">Özet>Detay</button>
        <button class="secondary" id="btnToggleArapca" style="flex: 2; padding: 8px 4px; font-weight: bold; font-size: 13px;">Arapça</button>
        <button class="secondary" id="btnFontAzalt" style="flex: 1; padding: 8px 4px; font-weight: bold; font-size: 13px;">A-</button>
        <button class="secondary" id="btnFontArttir" style="flex: 1; padding: 8px 4px; font-weight: bold; font-size: 13px;">A+</button>
    </div>

    <div class="zname" id="activeName">Salatı Münciye</div>
    
    <!-- ARAPÇA METİN (Sadece metin kaldı) -->
    <div id="arabicWrapper" style="display: none; margin: 20px 10px; justify-content: center;">
        <div id="arabicDisplay"></div>
    </div>
    
    <!-- SAYAÇ -->
    <div class="countrow">
      <span class="count" id="activeCount">0</span>
      <span class="smallmuted" id="activeTarget">/ 100</span>
      <span class="birikmis" id="activeBirikmis"></span>
    </div>
    <button class="counter" id="countButton" aria-label="Zikir say"><span class="finger">◎</span><strong>SAY</strong></button>
    <div class="hint">Hatim Sayısı: <span id="activeHatimCount">0</span></div>
    
    <!-- ALT DETAY BUTONLARI -->
    <div id="detayButonlari" style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px;">
        <button class="secondary" id="btnHatimEkle" style="font-size:12px; padding:8px 4px;">Hatim Ekle</button>
        <button class="secondary" id="btnHatimAzalt" style="font-size:12px; padding:8px 4px;">Hatim Azalt -</button>
        <button class="secondary" id="btnNiyet" style="font-size:12px; padding:8px 4px;">Niyet</button>

        <button class="secondary" id="btnHedef" style="font-size:12px; padding:8px 4px;">Hedef</button>
        <button class="secondary" id="btnPeriyot" style="font-size:12px; padding:8px 4px;">Ara Hatırlatma</button>
        <button class="secondary" id="btnArapca" style="font-size:12px; padding:8px 4px;">Arapça Düzenle</button>

        <button class="secondary" id="btnArtislar" style="font-size:12px; padding:8px 4px;">Artışlar</button>
        <button class="secondary danger" id="btnSil" style="font-size:12px; padding:8px 4px;">Bu sayacı sil</button>
        
        <label class="secondary" style="display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; padding:8px 4px; margin:0;">
            <input type="checkbox" id="chkGunlukArtir"> Günlük Artır
        </label>
    </div>
  </div>
</section>

<!-- 2. HAZIR TANIMLAR SEKME -->
<section id="list" class="view">
  <div class="sectionhead" style="margin-top:0;">
    <h2>Hazır Tanımlar</h2>
    <button class="primary" id="addSablonOpen">+ Yeni Tanım</button>
  </div>
  <div class="card" id="allList"></div>
</section>

<!-- 3. İSTATİSTİK SEKME -->
<section id="history" class="view">
  <div class="sectionhead" style="margin-top:0;"><h2>İstatistik</h2></div>
  <div class="statgrid">
    <div class="stat"><span class="smallmuted">Bugün</span><b id="statToday">0</b><span class="smallmuted">adet</span></div>
    <div class="stat"><span class="smallmuted">Tüm Zamanlar</span><b id="statTotal">0</b><span class="smallmuted">adet</span></div>
  </div>
  <div class="sectionhead"><h2>Son 5 Günlük Dağılım</h2></div>
  <div class="card" id="table5Days"></div>
</section>

<!-- 4. AYARLAR SEKME -->
<section id="settings" class="view">
  <div class="sectionhead" style="margin-top:0;"><h2>Ayarlar</h2></div>
  <div class="card">
    <div class="ztitle">Arapça Font</div>
    <select class="field" id="fontFamilySelect" style="margin-top:8px">
      <option value="'Scheherazade New', serif">Scheherazade</option>
      <option value="'Amiri', serif">Amiri</option>
      <option value="'Lateef', serif">Lateef</option>
      <option value="sans-serif">Varsayılan</option>
    </select>
  </div>
  <div class="card">
    <div class="ztitle">Günlük Hedef</div>
    <input class="field" id="dailyGoal" type="number" min="1" max="100000" value="300">
    <button class="primary" id="saveGoal">Hedefi kaydet</button>
  </div>
  <div class="card">
    <div class="ztitle">Yedekle / Yükle</div>
    <button class="secondary" id="exportData">Yedekle</button>
  </div>
</section>
</div>

<nav id="bottomNav"><div class="navinner">
<button class="navbtn active" data-tab="home"><span>⌂</span>Sayaçlar</button>
<button class="navbtn" data-tab="list"><span>☷</span>Hazır Tanımlar</button>
<button class="navbtn" data-tab="history"><span>▥</span>İstatistik</button>
<button class="navbtn" data-tab="settings"><span>⚙</span>Ayarlar</button>
</div></nav>

<div class="modal" id="addModal"><div class="sheet">
<h3 id="modalTitle">Yeni Tanım</h3>

<label class="label" id="hazirTanimLabel">Hazır Türler</label>
<select class="field" id="hazirTanimSelect" style="margin-bottom: 12px;">
  <option value="-1">-- Özel Sayaç (Diğer) --</option>
</select>

<label class="label">Ad</label><input class="field" id="newName" placeholder="Örn. Salatı Münciye" maxlength="50">
<label class="label">Arapça (İsteğe Bağlı)</label><textarea class="field" id="newArabic" rows="3" style="direction:rtl; font-family:'Amiri', serif; font-size:20px;"></textarea>
<div class="formrow">
  <div><label class="label">Hedef</label><input class="field" id="newTarget" type="number" min="1" value="100"></div>
  <div><label class="label">Ara Hatırlatma</label><input class="field" id="newPeriod" type="number" min="0" value="0"></div>
</div>
<div class="actions"><button class="secondary" id="cancelAdd">Vazgeç</button><button class="primary" id="saveZikir">Kaydet</button></div>
</div></div>

<script>
// Sürüm numarasını artırdık ki tarayıcı eski hatalı verileri unutsun
const KEY='hatim_takip_v8';
const today=()=>new Date().toLocaleDateString('en-CA');
const dateLabel=()=>new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());

const initial=()=>({
  goal:300, font:"'Scheherazade New', serif", activeId:null,
  sablonlar:[
    {id:'t1',name:'İhlası Şerif',arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ',target:100,period:0},
    {id:'t2',name:'Yasini Şerif',arabic:'يس',target:41,period:0},
    {id:'t3',name:'Ayetül Kürsi',arabic:'اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ',target:313,period:0},
    {id:'t4',name:'Tevhid',arabic:'لَا اِلَهَ اِلَّا اللَّهُ',target:70000,period:100},
    {id:'t5',name:'Salatı Münciye',arabic:'اَللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ',target:1000,period:0},
    {id:'t6',name:'Salatı Nariye',arabic:'اللَّهُمَّ صَلِّ صَلَاةً كَامِلَةً',target:4444,period:0},
    {id:'t7',name:'Vallahü Ğalibun',arabic:'وَاللَّهُ غَالِبٌ عَلَىٰ أَمْرِهِ',target:1461,period:100},
    {id:'t8',name:'Diğer',arabic:'',target:100,period:0}
  ],
  sayaclar:[], 
  history:{}, totalSayim:0
});

let data;
try {
    let saved = localStorage.getItem(KEY);
    if(saved) { data = JSON.parse(saved); } else { data = initial(); }
    if(!data.sablonlar) data.sablonlar = initial().sablonlar;
    if(!data.sayaclar) data.sayaclar = [];
} catch(e) { data = initial(); }

let previousCount=null, editingId=null, isSablonEditing=false;
let arapcaFontBoyut = 55; // Arapça metnin varsayılan boyutu
let ozetModu = false, arapcaModu = false;


function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function active(){return data.sayaclar.find(x=>x.id===data.activeId)}

function record(id, adet){
    const d=today();
    if(!data.history[d]) data.history[d] = {};
    if(!data.history[d][id]) data.history[d][id] = 0;
    data.history[d][id] += adet;
    data.totalSayim += adet;
}

function checkDailyAutoIncrease(){
    const bugun = today();
    let degisti = false;
    data.sayaclar.forEach(x => {
        if (x.otomatikArtis && x.lastDate && x.lastDate !== bugun) {
            const d1 = new Date(x.lastDate);
            const d2 = new Date(bugun);
            const farkGun = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
            if (farkGun > 0) x.birikmis += (farkGun * x.target);
        }
        if (x.lastDate !== bugun) { x.lastDate = bugun; degisti = true; }
    });
    if(degisti) localStorage.setItem(KEY,JSON.stringify(data));
}

function render(){
 checkDailyAutoIncrease();
 document.getElementById('todayLabel').textContent=dateLabel();
 
 const t=Object.values(data.history[today()]||{}).reduce((s,v)=>s+v,0);
 document.getElementById('statToday').textContent=t;
 document.getElementById('statTotal').textContent=data.totalSayim;
 
 // Sayaçlar Listesi
 document.getElementById('homeList').innerHTML=data.sayaclar.map(x=>`
   <div class="zrow selectable" data-open="${x.id}">
     <div class="zinfo">
       <div class="ztitle">${esc(x.name)}</div>
       <div class="zmeta">${x.count} / ${x.target} ${x.birikmis>0?`<span style="color:var(--red)">(${x.birikmis})</span>`:''} • Hatim: ${x.hatim}</div>
     </div>
     <span class="pill">></span>
   </div>`).join('') || '<div class="empty">Henüz aktif bir sayacınız yok.<br>Hazır Tanımlar sekmesinden ekleyin.</div>';

 // Hazır Tanımlar Listesi
 document.getElementById('allList').innerHTML=data.sablonlar.map(x=>`
   <div class="zrow" style="display: flex; justify-content: space-between; align-items: center;">
     <div class="zinfo">
       <div class="ztitle">${esc(x.name)}</div>
       <div class="zmeta">${x.target} adet hedef</div>
     </div>
     <button class="secondary danger" data-del-sablon="${x.id}" style="padding:6px 10px; font-size:12px;">Sil</button>
   </div>`).join('') || '<div class="empty">Henüz hazır tanım yok.</div>';
   
 // Son 5 Gün Tablosu
 let tableHtml = '<div class="table-row" style="font-weight:bold;color:var(--gold)"><span>Zikir</span>';
 let dates = [];
 for(let i=4; i>=0; i--){
    let d=new Date(); d.setDate(d.getDate()-i);
    dates.push(d.toLocaleDateString('en-CA'));
    tableHtml += `<span>${d.getDate()}</span>`;
 }
 tableHtml += '</div>';
 data.sayaclar.forEach(item => {
    tableHtml += `<div class="table-row"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(item.name)}</span>`;
    dates.forEach(dStr => {
        let val = (data.history[dStr] && data.history[dStr][item.id]) ? data.history[dStr][item.id] : 0;
        tableHtml += `<span style="width:30px;text-align:center;color:${val>0?'var(--white)':'var(--muted)'}">${val>0?val:'-'}</span>`;
    });
    tableHtml += '</div>';
 });
 document.getElementById('table5Days').innerHTML = tableHtml || '<div class="empty">Veri yok.</div>';

 // Detay Ekranı Verileri
 const a = active();
 if(a) {
   document.getElementById('activeName').textContent = a.name;
   document.getElementById('activeCount').textContent = a.count;
   document.getElementById('activeTarget').textContent = "/ " + a.target;
   document.getElementById('activeBirikmis').textContent = a.birikmis > 0 ? `(${a.birikmis})` : "";
   document.getElementById('activeHatimCount').textContent = a.hatim;
   document.getElementById('arabicDisplay').textContent = a.arabic || "";
   document.getElementById('arabicDisplay').style.fontFamily = data.font;
   document.getElementById('chkGunlukArtir').checked = a.otomatikArtis || false;
 }
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function addCount(id){
  let x=data.sayaclar.find(z=>z.id===id);
  if(!x)return;
  previousCount={id,count:x.count, birikmis:x.birikmis, hatim:x.hatim};
  
  if(x.birikmis > 0){ x.birikmis -= 1; }
  x.count++;
  
  if(x.count >= x.target){
    x.count = 0;
    x.hatim++;
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    alert(`Tebrikler! Hedefe ulaştınız. ${x.name} (${x.target})`);
  }
  if(x.period > 0 && x.count > 0 && x.count % x.period === 0){
    if(navigator.vibrate) navigator.vibrate(100);
  }
  record(id, 1);
  save();
}

function go(tab){
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===tab));
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  const nav = document.getElementById('bottomNav');
  if(tab === 'detay') { nav.style.display = 'none'; } else { nav.style.display = 'flex'; }
}

// --- TIKLAMA OLAYLARI ---
document.addEventListener('click',e=>{
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ go(tabBtn.dataset.tab); return; }

  // 1. Sayaç Ekle Butonu
  if(e.target.closest('#addOpen')){
      editingId=null; isSablonEditing=false; 
      document.getElementById('modalTitle').textContent='Yeni Sayaç Ekle';
      
      const label = document.getElementById('hazirTanimLabel');
      const select = document.getElementById('hazirTanimSelect');
      if(label) label.style.display='block';
      if(select) {
          select.style.display='block'; select.disabled=false;
          let selectHtml = '<option value="-1">-- Özel Sayaç (Diğer) --</option>';
          data.sablonlar.forEach(s => { selectHtml += `<option value="${s.id}">${s.name} (${s.target})</option>`; });
          select.innerHTML = selectHtml; select.value='-1';
      }
      
      document.getElementById('newName').value='';
      document.getElementById('newArabic').value='';
      document.getElementById('newTarget').value=100;
      document.getElementById('newPeriod').value=0;
      document.getElementById('addModal').classList.add('show');
      return;
  }

  // 2. Yeni Tanım Ekle Butonu
  if(e.target.closest('#addSablonOpen')){
      editingId=null; isSablonEditing=true; 
      document.getElementById('modalTitle').textContent='Yeni Hazır Tanım';
      
      const label = document.getElementById('hazirTanimLabel');
      const select = document.getElementById('hazirTanimSelect');
      if(label) label.style.display='none';
      if(select) select.style.display='none';
      
      document.getElementById('newName').value='';
      document.getElementById('newArabic').value='';
      document.getElementById('newTarget').value=100;
      document.getElementById('newPeriod').value=0;
      document.getElementById('addModal').classList.add('show');
      return;
  }
    
  // Şablon Silme
  const delSablon = e.target.closest('[data-del-sablon]');
  if(delSablon) {
      if(confirm("Bu hazır tanımı silmek istediğinize emin misiniz?")) {
          data.sablonlar = data.sablonlar.filter(x => x.id !== delSablon.dataset.delSablon);
          save(); 
      }
      return;
  }

  if(e.target.closest('#cancelAdd')){ document.getElementById('addModal').classList.remove('show'); return; }
  if(e.target.closest('#btnGeri')){ go('home'); return; }

  const open = e.target.closest('[data-open]');
  if(open){ data.activeId = open.dataset.open; save(); go('detay'); return; }
});

// --- BUTON İŞLEVLERİ ---
document.getElementById('countButton').onclick=()=>{if(active())addCount(active().id)};
document.getElementById('btnHatimEkle').onclick = () => { if(active()){ active().hatim++; save(); } };
document.getElementById('btnHatimAzalt').onclick = () => { if(active() && active().hatim > 0){ active().hatim--; save(); } };
document.getElementById('btnNiyet').onclick = () => {
    if(!active()) return;
    let niyet = prompt("Hatim Tanımı (Niyet) girin:", active().niyet || "");
    if(niyet !== null) { active().niyet = niyet; save(); }
};
document.getElementById('btnHedef').onclick = () => {
    if(!active()) return;
    let hedef = prompt("Yeni Hedef girin:", active().target);
    if(hedef !== null) { let h = parseInt(hedef); if(h > 0) { active().target = h; save(); } }
};
document.getElementById('btnPeriyot').onclick = () => {
    if(!active()) return;
    let p = prompt("Kaç sayıda bir hatırlatsın? (0 = Kapalı)", active().period || 0);
    if(p !== null) { let val = parseInt(p); if(val >= 0) { active().period = val; save(); } }
};
document.getElementById('btnArapca').onclick = () => {
    if(!active()) return;
    let ar = prompt("Arapça Metin girin:", active().arabic || "");
    if(ar !== null) { active().arabic = ar; save(); }
};
document.getElementById('btnArtislar').onclick = () => { alert("Bu sayaç için henüz artış geçmişi tutulmuyor."); };
document.getElementById('btnSil').onclick = () => {
    if(!active()) return;
    if(confirm("Bu sayacı silmek istediğinize emin misiniz?")) {
        data.sayaclar = data.sayaclar.filter(x => x.id !== active().id);
        data.activeId = null; save(); go('home');
    }
};
document.getElementById('chkGunlukArtir').onchange = (e) => {
    if(!active()) return;
    active().otomatikArtis = e.target.checked;
    if(active().otomatikArtis && !active().lastDate) active().lastDate = today();
    save();
};

// --- GÖRÜNÜM MODLARI (ÖZET / ARAPÇA) ---
document.getElementById('btnToggleOzet').onclick = () => {
    const btnOzet = document.getElementById('btnToggleOzet');
    const btnArapca = document.getElementById('btnToggleArapca');
    const detayAlan = document.getElementById('detayButonlari');
    const wrapper = document.getElementById('arabicWrapper');

    if (arapcaModu) {
        arapcaModu = false;
        wrapper.style.display = 'none';
        btnArapca.disabled = false; btnArapca.style.opacity = '1';
        detayAlan.style.display = 'grid';
        btnOzet.textContent = "Özet>Detay"; 
        ozetModu = false;
        return;
    }

    ozetModu = !ozetModu;
    if (ozetModu) {
        btnOzet.textContent = "Detay>Özet";
        detayAlan.style.display = 'none'; 
    } else {
        btnOzet.textContent = "Özet>Detay";
        detayAlan.style.display = 'grid'; 
    }
};

document.getElementById('btnToggleArapca').onclick = () => {
    arapcaModu = !arapcaModu;
    const btnArapca = document.getElementById('btnToggleArapca');
    const wrapper = document.getElementById('arabicWrapper');
    const arabicDiv = document.getElementById('arabicDisplay');
    const detayAlan = document.getElementById('detayButonlari');
    const btnOzet = document.getElementById('btnToggleOzet');
    const btnA_ = document.getElementById('btnFontAzalt');
    const btnAplus = document.getElementById('btnFontArttir');
    
    if (arapcaModu) {
        wrapper.style.display = 'flex'; 
        arabicDiv.style.fontSize = arapcaFontBoyut + 'px'; 
        detayAlan.style.display = 'none'; 
        
        btnArapca.disabled = true; 
        btnArapca.style.opacity = '0.5'; 
        btnOzet.textContent = "Detay>Özet"; 
        ozetModu = false; 

        // Arapça açılınca font butonlarını aktif yap
        btnA_.disabled = false; btnA_.style.opacity = '1';
        btnAplus.disabled = false; btnAplus.style.opacity = '1';
    } else {
        wrapper.style.display = 'none'; 
        detayAlan.style.display = 'grid'; 
        btnArapca.disabled = false; btnArapca.style.opacity = '1';
        btnOzet.textContent = "Özet>Detay";

        // Arapça kapanınca font butonlarını pasif yap
        btnA_.disabled = true; btnA_.style.opacity = '0.3';
        btnAplus.disabled = true; btnAplus.style.opacity = '0.3';
    }
};

// A+ / A- Butonları
document.getElementById('btnFontArttir').onclick = () => {
    if (arapcaFontBoyut < 120) { 
        arapcaFontBoyut += 10;
        document.getElementById('arabicDisplay').style.fontSize = arapcaFontBoyut + 'px';
    }
};
document.getElementById('btnFontAzalt').onclick = () => {
    if (arapcaFontBoyut > 30) { 
        arapcaFontBoyut -= 10;
        document.getElementById('arabicDisplay').style.fontSize = arapcaFontBoyut + 'px';
    }
};

// Dropdown Seçimi
document.getElementById('hazirTanimSelect').onchange = (e) => {
  const val = e.target.value;
  if (val !== "-1") {
    const sablon = data.sablonlar.find(s => s.id === val);
    if(sablon) {
        document.getElementById('newName').value = sablon.name;
        document.getElementById('newTarget').value = sablon.target;
        document.getElementById('newArabic').value = sablon.arabic || '';
        document.getElementById('newPeriod').value = sablon.period || 0;
    }
  } else {
    document.getElementById('newName').value = '';
    document.getElementById('newTarget').value = 100;
    document.getElementById('newArabic').value = '';
    document.getElementById('newPeriod').value = 0;
  }
};

// Kaydet Butonu
document.getElementById('saveZikir').onclick=()=>{
  let name=document.getElementById('newName').value.trim();
  let arabic=document.getElementById('newArabic').value.trim();
  let target=Math.max(1,Number(document.getElementById('newTarget').value)||100);
  let period=Math.max(0,Number(document.getElementById('newPeriod').value)||0);
  
  if(!name){ alert('Lütfen Ad girin.'); return; }
  
  if(isSablonEditing){
    data.sablonlar.push({id:'t'+Date.now(), name, arabic, target, period});
  } else {
    let id='z'+Date.now();
    data.sayaclar.push({ id: id, name: name, arabic: arabic, target: target, period: period, count: 0, hatim: 0, birikmis: 0, lastDate: today(), niyet: '', otomatikArtis: false });
    data.activeId = id; 
  }
  document.getElementById('addModal').classList.remove('show');
  save(); 
};

document.getElementById('fontFamilySelect').onchange=(e)=>{ data.font=e.target.value; save(); };
document.getElementById('saveGoal').onclick=()=>{ data.goal=Math.max(1,Number(document.getElementById('dailyGoal').value)||300); save(); };
document.getElementById('exportData').onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='hatim_yedek.json'; a.click();
  URL.revokeObjectURL(url);
};
// render() fonksiyonunun içine, en alta:
if(!arapcaModu) {
    document.getElementById('btnFontAzalt').disabled = true;
    document.getElementById('btnFontAzalt').style.opacity = '0.3';
    document.getElementById('btnFontArttir').disabled = true;
    document.getElementById('btnFontArttir').style.opacity = '0.3';
}
render();
</script>
</body>
</html>
